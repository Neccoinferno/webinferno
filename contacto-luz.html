<!DOCTYPE html>
<html lang="es">

    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="imagenes/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="habitacion-luz">

    <header class="barra-navegacion">
    <a href="luz.html" class="sitio-identidad">
        <!--<img src="imagenes/logo.png" alt="Logo" class="sitio-logo">-->
        <img src="imagenes/lys.png" alt="flor de lys" class="logo-lys-violeta">
        <h1 style="color: blueviolet;">Saltimbanquis y Azucenas</h1>
        <img src="imagenes/lys.png" alt="flor de lys" class="logo-lys-violeta">
    </a>
        <nav class="sitio-menu">
            <a href="luz.html">Inicio</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <article class="formulario-contenedor">
            <h2>Contacto</h2>
            <hr class="neon">
            <p>Si quieres transmitir algo, deja tu mensaje aquí.</p>

            <!-- FORMULARIO -->
            <form action="https://formspree.io/f/xzdnjzkv" method="POST" class="form-cyber">
                <div class="campo">
                    <label for="nombre">Nombre / Nickname</label>
                    <input type="text" id="nombre" name="name" required placeholder="Tu nombre...">
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="message" rows="5" required placeholder="Escribe tu mensaje..."></textarea>
                </div>

                <button type="submit" class="boton-neon">Enviar mensaje</button>
            </form>
        </article>
    </main>

    <footer>
        <img src="imagenes/firma.png" alt="Firma" class="footer-icono">
    </footer>

</body>
</html>
